<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffdf5"><title>Bunny Digital Clock</title>
<style>:root{--page:#fffdf5;--cream:#fff0bd;--pink:#f4b2c5;--ink:#29221d;--muted:#a78c78;--display:#fff8df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:20px;background:var(--page);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
.weather-scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.sun-glow{position:absolute;inset:-20%;opacity:0;background:radial-gradient(ellipse at 8% 4%,#ffda7e70,transparent 35%),radial-gradient(ellipse at 95% 18%,#ffe9ac50,transparent 32%);animation:glow 18s ease-in-out infinite alternate;transition:opacity 1.5s}.cloud{position:absolute;width:48vw;height:25vw;min-height:180px;border-radius:50%;filter:blur(45px);background:#b4c3cd25;opacity:0;animation:drift 28s ease-in-out infinite alternate;transition:opacity 1.5s}.cloud-a{top:-9%;left:-12%}.cloud-b{right:-16%;bottom:3%;animation-delay:-9s}
#particles{position:absolute;inset:0}.particle{position:absolute;top:-12vh;left:var(--x);opacity:var(--alpha);animation:fall var(--duration) linear var(--delay) infinite}.rain{width:1px;height:28px;background:linear-gradient(transparent,#698fa580)}.snow{width:var(--size);height:var(--size);border-radius:50%;background:#ffffffd9;box-shadow:0 0 5px #a0becd40}
body[data-weather=sun] .sun-glow{opacity:1}body[data-weather=cloud] .cloud{opacity:.75}body[data-weather=rain]{background:#f8fbfc}body[data-weather=snow]{background:#f7fbfd}
.page{position:relative;z-index:1;width:min(520px,94vw);display:flex;flex-direction:column;align-items:center;gap:22px}.shell{position:relative;width:100%;padding-top:65px;filter:drop-shadow(0 10px 0 #29221d0b)}
.ears{position:absolute;top:0;left:50%;width:116px;height:100px;transform:translateX(-50%);z-index:0}.ear{position:absolute;bottom:0;width:61px;height:116px}.left{left:2px;transform:rotate(-9deg)}.right{right:0;transform:rotate(7deg) scale(.96)}.outline{fill:var(--cream);stroke:var(--ink);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.inner{fill:var(--pink);stroke:#29221d24;stroke-width:1.1}
.card{position:relative;z-index:1;width:100%;padding:20px 25px 17px;border:3px solid var(--ink);border-radius:29px;background:var(--cream)}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{min-height:28px;margin-bottom:10px}.top span{font-size:.76rem;font-weight:900;letter-spacing:.14em;color:var(--muted)}#weatherIcon{width:30px;height:30px;object-fit:contain}
.display{padding:14px 7px;border:2px solid #29221d1f;border-radius:17px;background:var(--display)}#digitalTime{display:flex;align-items:center;justify-content:center;gap:clamp(2px,.7vw,6px)}.digit{display:block;width:clamp(25px,7.7vw,48px);height:auto;flex:0 1 auto}.colon{width:clamp(7px,1.8vw,12px);height:64px;flex:0 0 auto}.segment,.colon-dot{fill:var(--ink)}
.bottom{margin-top:12px;min-height:25px}#date{font-size:.72rem;font-weight:800;letter-spacing:.07em;color:var(--muted)}button{border:1px solid #29221d38;border-radius:999px;padding:7px 11px;background:#fffdf580;color:var(--ink);font:inherit;font-size:.7rem;cursor:pointer}button:hover{background:#fffdf5}button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}button:disabled{opacity:.6;cursor:wait}#hint{margin:0;color:var(--muted);font-size:.78rem;text-align:center}
@keyframes fall{from{transform:translate3d(0,-12vh,0)}to{transform:translate3d(-4vw,115vh,0)}}@keyframes glow{from{transform:translate(-1%,-1%) scale(1)}to{transform:translate(1%,1%) scale(1.05)}}@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(8%)}}
@media(max-width:420px){.page{width:96vw;gap:17px}.card{padding:16px 12px 13px;border-radius:24px}.display{padding:12px 3px}.bottom{margin-top:9px}#date{font-size:.6rem;letter-spacing:.03em}button{font-size:.62rem;padding:6px 8px}.colon{height:48px}.ears{transform:translateX(-50%) scale(.86);transform-origin:bottom center}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style>
</head>
<body>
<div class="weather-scene" aria-hidden="true"><div class="sun-glow"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div id="particles"></div></div>
<main class="page"><section class="shell" aria-label="Bunny digital clock">
<div class="ears" aria-hidden="true"><svg class="ear left" viewBox="0 0 74 142"><path class="outline" d="M15 130C8 105 7 71 14 38 19 13 32 4 44 12 60 22 64 54 60 83 58 105 54 122 49 134 39 140 24 139 15 130Z"/><path class="inner" d="M24 119C18 93 18 62 24 39 28 23 35 19 41 25 51 35 53 59 50 82 48 101 44 116 40 126 34 129 28 125 24 119Z"/></svg><svg class="ear right" viewBox="0 0 74 142"><path class="outline" d="M16 132C10 107 8 78 14 47 19 20 33 6 46 13 62 21 66 52 61 82 58 105 53 124 48 135 39 140 24 140 16 132Z"/><path class="inner" d="M25 120C19 96 19 68 25 46 29 28 37 20 43 27 53 37 54 60 51 83 48 103 44 118 39 127 34 129 29 125 25 120Z"/></svg></div>
<div class="card"><div class="top"><span id="ampm">AM</span><img id="weatherIcon" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PGNpcmNsZSBjeD0iMjQiIGN5PSIyNCIgcj0iMTciIGZpbGw9IiNmN2U3YjQiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjMiLz48cGF0aCBkPSJNMTkgMThhNS4zIDUuMyAwIDEgMSA4LjkgMy45Yy0yLjUgMi4xLTMuOSAzLTMuOSA2IiBmaWxsPSJub25lIiBzdHJva2U9IiMyOTIyMWQiIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PGNpcmNsZSBjeD0iMjQiIGN5PSIzNCIgcj0iMS44IiBmaWxsPSIjMjkyMjFkIi8+PC9zdmc+" alt="" title="날씨 연결 전"></div><div class="display"><div id="digitalTime" role="timer" aria-label="현재 시각"></div></div><div class="bottom"><time id="date">MON, JAN 01</time><button id="weatherButton">날씨 연결</button></div></div>
</section><p id="hint">오늘의 날씨에 따라 배경 분위기가 살짝 달라져요.</p></main>
<script>const DIGITS={"0":"abcdef","1":"bc","2":"abged","3":"ab c d g".replaceAll(" ",""),"4":"fgbc","5":"afgcd","6":"afgecd","7":"abc","8":"abcdefg","9":"abcdfg"};
const SEG={a:"10,4 44,4 39,9 15,9",b:"45,7 49,11 49,39 44,44 40,39 40,14",c:"45,46 49,50 49,78 44,83 40,78 40,53",d:"15,81 39,81 44,86 10,86",e:"5,50 10,46 14,53 14,78 10,83 5,78",f:"5,11 10,7 14,14 14,39 10,44 5,39",g:"12,43 17,40 37,40 42,45 37,49 17,49 12,46"};
const ns="http://www.w3.org/2000/svg";
function digit(ch){const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 54 90");s.classList.add("digit");s.setAttribute("aria-hidden","true");for(const key of DIGITS[ch]||""){const p=document.createElementNS(ns,"polygon");p.setAttribute("points",SEG[key]);p.classList.add("segment");s.append(p)}return s}
function colon(){const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 12 90");s.classList.add("colon");s.setAttribute("aria-hidden","true");for(const y of [29,58]){const r=document.createElementNS(ns,"rect");r.setAttribute("x","3");r.setAttribute("y",y);r.setAttribute("width","6");r.setAttribute("height","6");r.classList.add("colon-dot");s.append(r)}return s}
function renderDigitalTime(container,text){const f=document.createDocumentFragment();for(const ch of text)f.append(ch===":"?colon():digit(ch));container.replaceChildren(f);container.setAttribute("aria-label",`현재 시각 ${text}`)}

function startClock(){const el=document.querySelector("#digitalTime"),ampm=document.querySelector("#ampm"),date=document.querySelector("#date");
function update(){const n=new Date(),h=n.getHours(),h12=h%12||12,t=[String(h12).padStart(2,"0"),String(n.getMinutes()).padStart(2,"0"),String(n.getSeconds()).padStart(2,"0")].join(":");renderDigitalTime(el,t);ampm.textContent=h>=12?"PM":"AM";date.textContent=new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"2-digit"}).format(n).toUpperCase()}
function tick(){update();setTimeout(tick,1000-Date.now()%1000)}update();setTimeout(tick,1000-Date.now()%1000)}
const holder=document.querySelector("#particles");let active="";
function particle(kind,i){const p=document.createElement("span");p.className=`particle ${kind}`;p.style.setProperty("--x",`${(i*37.7+4)%100}%`);p.style.setProperty("--duration",`${kind==="rain"?1.8+(i%7)*.32:5+(i%8)*.7}s`);p.style.setProperty("--delay",`${-(i%13)*.63}s`);p.style.setProperty("--alpha",`${kind==="rain"?.12+(i%4)*.035:.35+(i%4)*.08}`);p.style.setProperty("--size",`${2+i%4}px`);return p}
function applyWeatherEffect(kind){if(kind===active)return;active=kind;document.body.dataset.weather=kind;holder.replaceChildren();const type=kind==="rain"?"rain":kind==="snow"?"snow":null;if(type){const count=type==="rain"?36:22;for(let i=0;i<count;i++)holder.append(particle(type,i))}}

const icon=document.querySelector("#weatherIcon"),button=document.querySelector("#weatherButton"),hint=document.querySelector("#hint");
const icons={sun:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMjkyMjFkIiBzdHJva2Utd2lkdGg9IjIuNCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJNMjQgM3Y1TTI0IDQwdjVNMyAyNGg1TTQwIDI0aDVNOSA5bDQgNE0zNSAzNWw0IDRNMzkgOWwtNCA0TTEzIDM1bC00IDQiLz48L2c+PGNpcmNsZSBjeD0iMjQiIGN5PSIyNCIgcj0iMTAiIGZpbGw9IiNmNGM2NWUiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjQiLz48L3N2Zz4=',cloud:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHBhdGggZD0iTTE0IDM2aDIxYTggOCAwIDAgMCAuNS0xNiAxMiAxMiAwIDAgMC0yMy0yQTkgOSAwIDAgMCAxNCAzNloiIGZpbGw9IiNkOWUwZGYiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48L3N2Zz4=',rain:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHBhdGggZD0iTTEyIDI3aDI0YTcgNyAwIDAgMCAuMy0xNCAxMSAxMSAwIDAgMC0yMS0yQTggOCAwIDAgMCAxMiAyN1oiIGZpbGw9IiNkOWUwZGYiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjIiLz48ZyBzdHJva2U9IiM4NmE5YmQiIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIj48cGF0aCBkPSJtMTUgMzMtMiA1TTI1IDMzbC0yIDVNMzUgMzNsLTIgNSIvPjwvZz48L3N2Zz4=',snow:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHBhdGggZD0iTTEyIDI3aDI0YTcgNyAwIDAgMCAuMy0xNCAxMSAxMSAwIDAgMC0yMS0yQTggOCAwIDAgMCAxMiAyN1oiIGZpbGw9IiNkOWUwZGYiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjIiLz48ZyBmaWxsPSIjOWNjNWRjIj48Y2lyY2xlIGN4PSIxNCIgY3k9IjM1IiByPSIyLjQiLz48Y2lyY2xlIGN4PSIyNCIgY3k9IjM5IiByPSIyLjQiLz48Y2lyY2xlIGN4PSIzNCIgY3k9IjM0IiByPSIyLjQiLz48L2c+PC9zdmc+',unknown:'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PGNpcmNsZSBjeD0iMjQiIGN5PSIyNCIgcj0iMTciIGZpbGw9IiNmN2U3YjQiIHN0cm9rZT0iIzI5MjIxZCIgc3Ryb2tlLXdpZHRoPSIyLjMiLz48cGF0aCBkPSJNMTkgMThhNS4zIDUuMyAwIDEgMSA4LjkgMy45Yy0yLjUgMi4xLTMuOSAzLTMuOSA2IiBmaWxsPSJub25lIiBzdHJva2U9IiMyOTIyMWQiIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PGNpcmNsZSBjeD0iMjQiIGN5PSIzNCIgcj0iMS44IiBmaWxsPSIjMjkyMjFkIi8+PC9zdmc+'};
function set(kind,label){icon.src=icons[kind]||icons.unknown;icon.title=label;applyWeatherEffect(kind)}
function classify(c){if(c===0||c===1)return"sun";if([2,3,45,48].includes(c))return"cloud";if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(c))return"rain";if([71,73,75,77,85,86].includes(c))return"snow";return"unknown"}
async function lookup(lat,lon){const u=new URL("https://api.open-meteo.com/v1/forecast");u.search=new URLSearchParams({latitude:lat,longitude:lon,current:"weather_code",timezone:"auto"});const r=await fetch(u);if(!r.ok)throw Error("Weather API error");const d=await r.json();if(!Number.isFinite(d?.current?.weather_code))throw Error("Weather unavailable");const k=classify(d.current.weather_code);set(k,({sun:"맑음",cloud:"흐림",rain:"비",snow:"눈",unknown:"날씨 정보 없음"})[k]);button.textContent="날씨 새로고침";hint.textContent="실제 날씨에 따라 배경 분위기가 살짝 달라져요."}
function connect(){if(!navigator.geolocation){hint.textContent="위치 기능을 사용할 수 없어 기본 배경으로 표시 중이에요.";return}button.disabled=true;button.textContent="불러오는 중…";hint.textContent="날씨 조회를 위해 위치 권한이 필요해요.";navigator.geolocation.getCurrentPosition(async p=>{try{await lookup(p.coords.latitude,p.coords.longitude)}catch(e){console.warn(e);set("unknown","날씨를 불러오지 못했습니다.");hint.textContent="날씨를 불러오지 못했지만 시계는 정상 작동해요."}finally{button.disabled=false}},()=>{set("unknown","위치 권한이 없습니다.");hint.textContent="위치 권한이 없어 기본 배경으로 표시 중이에요.";button.disabled=false;button.textContent="날씨 연결"},{timeout:10000,maximumAge:900000,enableHighAccuracy:false})}
function startWeather(){set("unknown","날씨 연결 전");button.addEventListener("click",connect)}
startClock();startWeather();</script>
</body></html>
